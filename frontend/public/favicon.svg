<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#07101d"/>
    </linearGradient>
    <linearGradient id="sweep" x1="32" y1="32" x2="54" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app-icon tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- ambient glow -->
  <circle cx="32" cy="32" r="24" fill="url(#glow)"/>

  <!-- radar rings -->
  <g fill="none" stroke="#2dd4bf">
    <circle cx="32" cy="32" r="22" stroke-opacity="0.22"/>
    <circle cx="32" cy="32" r="15" stroke-opacity="0.38"/>
    <circle cx="32" cy="32" r="8" stroke-opacity="0.55"/>
  </g>

  <!-- crosshair -->
  <g stroke="#2dd4bf" stroke-opacity="0.28" stroke-width="1">
    <line x1="32" y1="9" x2="32" y2="55"/>
    <line x1="9" y1="32" x2="55" y2="32"/>
  </g>

  <!-- sweep wedge + leading edge -->
  <path d="M32 32 L32 10 A22 22 0 0 1 52 23 Z" fill="url(#sweep)"/>
  <line x1="32" y1="32" x2="32" y2="10" stroke="#2dd4bf" stroke-width="1.6" stroke-linecap="round"/>

  <!-- congestion blips -->
  <circle cx="44" cy="22" r="2.6" fill="#ef4444"/>
  <circle cx="22" cy="40" r="2.3" fill="#f59e0b"/>
  <circle cx="40" cy="44" r="2.3" fill="#10b981"/>

  <!-- center hub -->
  <circle cx="32" cy="32" r="3.4" fill="#2dd4bf"/>
  <circle cx="32" cy="32" r="6" fill="#2dd4bf" fill-opacity="0.18"/>
</svg>
